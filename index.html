<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخطة التنموية المحلية لبلدية سلفيت 2027–2031</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#17222e;--mu:#667585;--bd:#e0e6ee;--nv:#1F4E78;--bl:#2E75B6;--or:#ED7D31;--tl:#1B998B;--tr:#e6edf5;--hm:46,117,182;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#172230;--tx:#e8eef5;--mu:#93a3b5;--bd:#263548;--nv:#7fb2e5;--tr:#22324a;--hm:91,155,213}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#172230;--tx:#e8eef5;--mu:#93a3b5;--bd:#263548;--nv:#7fb2e5;--tr:#22324a;--hm:91,155,213}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:15px;max-width:760px;margin:auto}
.hero{background:linear-gradient(160deg,#173a5a,#1F4E78 55%,#2E75B6);color:#fff;text-align:center;padding:26px 18px 30px;border-radius:0 0 28px 28px}
.logo{width:104px;height:104px;border-radius:50%;background:#fff;padding:6px;object-fit:contain;box-shadow:0 6px 20px #0004}
.hero h1{font-size:19px;margin:14px 0 6px;line-height:1.5}.hero p{font-size:13px;opacity:.85}
.yr{display:inline-block;margin-top:10px;background:#ffffff26;border-radius:20px;padding:3px 16px;font-weight:700;letter-spacing:1px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--nv);color:var(--card);border-color:var(--nv);font-weight:700}
main{padding:0 12px 20px}section{display:none}section.on{display:block;animation:f .35s}
@keyframes f{from{opacity:0;transform:translateY(8px)}}
h2{font-size:16px;margin:18px 4px 10px;color:var(--nv)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.kpi:first-child{grid-column:span 2;background:var(--nv);color:var(--card)}
.kpi b{display:block;font-size:28px;color:var(--bl)}.kpi:first-child b{color:inherit;font-size:34px}.kpi span{font-size:12.5px;color:var(--mu)}.kpi:first-child span{color:inherit;opacity:.85}
.row{margin:10px 0}.row .l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:4px}.row .l em{font-style:normal;font-weight:700;white-space:nowrap}
.tk{height:10px;background:var(--tr);border-radius:6px;overflow:hidden}.tk i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
details{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;overflow:hidden}
summary{padding:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
summary::-webkit-details-marker{display:none}summary small{display:block;color:var(--mu);font-weight:400}
summary:after{content:"▾";color:var(--mu)}details[open] summary:after{content:"▴"}details .in{padding:0 14px 10px}
.pill{background:var(--nv);color:var(--card);border-radius:12px;padding:2px 10px;font-size:13px}
.rk{display:inline-block;min-width:22px;text-align:center;border-radius:11px;background:var(--tr);font-size:12px;font-weight:700;padding:0 6px;margin-inline-start:6px}.rk.g{background:#FFE08A;color:#5a4300}
.sm{font-size:12px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px}.chips button.on{background:var(--or);border-color:var(--or);color:#fff}
.rl{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.rn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tr);display:grid;place-items:center;font-weight:700;font-size:13px}.rn.g{background:#FFD25E;color:#4a3600}.rl>div{flex:1}
.tg{font-size:11px;color:var(--mu)}
.find{border-inline-start:4px solid var(--or);padding:8px 12px;margin:8px 0;background:var(--tr);border-radius:8px;font-size:14px}
.seg{display:flex;background:var(--tr);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;color:var(--tx);padding:8px;border-radius:10px;font:inherit}.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 4px #0002}
.sc{overflow-x:auto;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);min-width:62px}
th{background:var(--nv);color:var(--card);font-weight:600;font-size:12px}td:first-child,th:first-child{position:sticky;right:0;min-width:128px;max-width:128px;text-align:right;background:var(--card);z-index:1;font-size:12px}th:first-child{background:var(--nv)}
tr.n td{background:var(--tr);font-weight:700}
.nt ol{padding-inline-start:20px}.nt li{margin:7px 0;font-size:13.5px}
#q{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:11px 14px;font:inherit;margin-bottom:10px}
.rh{display:flex;align-items:center;gap:10px}.rh>div{flex:1}.rh .rn{display:grid;place-items:center;flex:none}.rh a{color:var(--bl);text-decoration:none}
.tag{display:inline-block;background:var(--tr);border-radius:10px;padding:1px 9px;font-size:12px;margin:6px 0 2px 5px}
.cps{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.cp{color:#fff;border-radius:10px;padding:2px 9px;font-size:12px}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mu);margin:4px 2px 10px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}.tl.w{grid-column:span 2;align-items:stretch;text-align:right;padding:14px}
.tl h3{font-size:12.5px;color:var(--mu);font-weight:600;line-height:1.4}.ic{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:#fff}.hd{display:flex;gap:9px;align-items:center}
.rg{width:92px;height:92px}.rg circle:nth-child(2){animation:rg 1.3s ease-out}@keyframes rg{from{stroke-dasharray:0 213.6}}
.tl b{font-size:14px;line-height:1.4}.big{font-size:30px;font-weight:800;line-height:1.1}.big small{display:block;font-size:11.5px;font-weight:500;color:var(--mu)}
.pd{display:flex;align-items:center;gap:10px;margin:8px 0}.pd .m{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}.pd>div{flex:1;font-size:13px}.pd em{font-style:normal;font-weight:800;font-size:16px}
.lo{display:flex;gap:8px;align-items:center;text-align:right;font-size:12px;margin:2px 0;width:100%}.lo em{font-style:normal;font-weight:800;font-size:20px;color:var(--or);flex:none;min-width:22px;text-align:center}
.nt2{font-size:11.5px;color:var(--mu);line-height:1.5}
footer{text-align:center;padding:26px 16px 30px;color:var(--mu);font-size:13px;border-top:1px solid var(--bd);margin:0 12px}
footer img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}footer b{display:block;color:var(--tx);font-size:15px;margin-top:6px}
</style></head><body>

function rank(f){let r=0,pv=null,pr=0;$('#rl').innerHTML=all.map((s,i)=>{const rr=(pv===s.c)?pr:i+1;pv=s.c;pr=rr;return {s,rr}}).filter(x=>f<0||x.s.k==f).map(({s,rr})=>`<div class="rl"><div class="rn${rr<=3?' g':''}">${rr}</div><div>${bar(s.n,s.c,all[0].c,`${s.c} · ${P(s.p)}`,C[s.k])}<div class="tg" style="margin-top:-6px">${s.m} — ${P(s.c/tot)} من إجمالي الاختيارات</div></div></div>`).join('');setTimeout(()=>document.querySelectorAll('#rl [data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),30)}
$('#s2').innerHTML=`<h2>الترتيب العام لجميع اللجان الفرعية (${all.length})</h2><div class="chips" id="ch"><button class="on" data-f="-1">الكل</button>${D.main.map((m,k)=>`<button data-f="${k}">${m.name}</button>`).join('')}</div><div class="card" id="rl"></div><p class="sm" style="padding:0 6px">الشريط يقارن بأعلى لجنة. مجموع الاختيارات: ${tot}.</p>`;
$('#ch').onclick=e=>{if(e.target.dataset.f){document.querySelectorAll('#ch button').forEach(b=>b.classList.toggle('on',b==e.target));rank(+e.target.dataset.f)}};rank(-1);
$('#s3').innerHTML=`<h2>خصائص المستجيبين</h2>`+D.demo.map((d,k)=>{const m=Math.max(...d.rows.map(r=>r[1]));return `<div class="card"><b>${d.t}</b>${d.rows.map(r=>bar(r[0],r[1],m,`${r[1]} · ${P(r[2])}`,C[k])).join('')}</div>`}).join('')+`<p class="sm" style="padding:0 6px">في «طبيعة المشاركة» و«الفئات الممثَّلة» قد يتجاوز المجموع 100% لأن المستجيب قد ينتمي لأكثر من فئة.</p>`;
function xt(rows){return `<div class="sc"><table><tr><th>اللجنة</th>${D.groups.map(g=>`<th>${g}</th>`).join('')}</tr><tr class="n"><td>حجم المجموعة (n)</td>${D.n.map(n=>`<td>${n}</td>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td style="background:rgba(var(--hm),${Math.min(v/.9,1)*.85});${v>.5?'color:#fff;font-weight:700':''}">${Math.round(v*100)}%</td>`).join('')}</tr>`).join('')}</table></div>`}
function cx(k){$('#xb').innerHTML=xt(k?D.xs:D.xm);document.querySelectorAll('#sg button').forEach((b,i)=>b.classList.toggle('on',i==k))}
$('#s4').innerHTML=`<h2>اهتمام كل فئة باللجان</h2><div class="seg" id="sg"><button>اللجان الرئيسية</button><button>اللجان الفرعية</button></div><div id="xb"></div><p class="sm" style="padding:8px 6px">القيمة = نسبة أفراد المجموعة الذين اختاروا اللجنة (من n). المجموعات التي n فيها أقل من 10 مؤشرية فقط. مرّر الجدول أفقياً.</p>`;
$('#sg').onclick=e=>{const i=[...$('#sg').children].indexOf(e.target);if(i>=0)cx(i)};cx(0);
const SN=D.main.flatMap((m,k)=>m.subs.map(s=>({n:s.n,k})));
$('#s5').innerHTML=`<h2>جميع الاستبانات (${D.resp.length})</h2><input id="q" type="search" placeholder="ابحث بالاسم أو الجوال أو الجهة…"><div class="chips" id="rf" data-f="-1"><button class="on" data-f="-1">الكل</button>${D.main.map((m,k)=>`<button data-f="${k}">${m.name}</button>`).join('')}</div><div class="lg">${D.main.map((m,k)=>`<span><i style="background:${C[k]}"></i>${m.name}</span>`).join('')}</div><p class="sm" id="rc" style="margin:0 4px 8px"></p><div id="rb"></div>`;
function rs(){const q=$('#q').value.trim(),f=+$('#rf').dataset.f,L=D.resp.filter(r=>(f<0||r[8].some(i=>SN[i].k==f))&&(!q||[r[1],r[2],r[3],r[4]].join(' ').includes(q)));
$('#rc').textContent=`عرض ${L.length} من ${D.resp.length} استبانة`;
$('#rb').innerHTML=L.map(r=>{const d=r[2].replace(/[^\d+]/g,''),ph=d.length>=9?`<a href="tel:${d}"><bdi dir="ltr">${r[2]}</bdi></a>`:`<bdi dir="ltr">${r[2]}</bdi>`;
return `<div class="card"><div class="rh"><span class="rn">${r[0]}</span><div><b>${r[1]}</b><div class="sm">${ph}</div></div><span class="pill" title="عدد اللجان المختارة">${r[8].length}</span></div><div>${[r[3],r[5],r[6]].map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="sm">الجهة: ${r[4]}<br>الفئة التي يمثلها: ${r[7]}</div><div class="cps">${r[8].length?r[8].map(i=>`<span class="cp" style="background:${C[SN[i].k]}">${SN[i].n}</span>`).join(''):'<span class="sm">لم يختر أي لجنة</span>'}</div></div>`}).join('')||'<p class="sm">لا نتائج</p>'}
$('#q').oninput=rs;$('#rf').onclick=e=>{if(e.target.dataset.f){$('#rf').dataset.f=e.target.dataset.f;document.querySelectorAll('#rf button').forEach(b=>b.classList.toggle('on',b==e.target));rs()}};rs();
show(0);
</script></body></html>
